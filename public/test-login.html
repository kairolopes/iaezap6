<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAeZap Login Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .response {
            margin-top: 30px;
            padding: 20px;
            border-radius: 4px;
            display: none;
        }

        .response.success {
            background: #f0f9ff;
            border: 1px solid #a3d8ff;
            color: #003d82;
            display: block;
        }

        .response.error {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #7f1d1d;
            display: block;
        }

        .response-title {
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .response-content {
            font-size: 12px;
            font-family: 'Monaco', 'Menlo', monospace;
            background: rgba(255, 255, 255, 0.5);
            padding: 12px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 300px;
            overflow-y: auto;
        }

        .token-info {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 4px;
            font-size: 12px;
        }

        .token-info h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .token-info .token {
            background: white;
            padding: 10px;
            border-radius: 3px;
            margin-bottom: 10px;
            word-break: break-all;
            font-family: monospace;
            font-size: 11px;
        }

        .copy-btn {
            padding: 6px 12px;
            font-size: 11px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin-left: 10px;
        }

        .copy-btn:hover {
            background: #764ba2;
        }

        .info {
            background: #f0f4ff;
            border: 1px solid #c5d9ff;
            color: #003d82;
            padding: 15px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .loading {
            display: inline-block;
            width: 4px;
            height: 4px;
            background: currentColor;
            border-radius: 50%;
            animation: loading 1.4s infinite;
        }

        @keyframes loading {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>IAeZap Login Test</h1>
        <p class="subtitle">Test the login endpoint</p>

        <div class="info">
            <strong>ℹ️ Test Credentials:</strong><br>
            Email: test@example.com<br>
            Password: TestPassword123<br>
            Company ID: (leave empty for auto-detection)
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="user@example.com"
                    value="test@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Your password"
                    value="TestPassword123"
                    required
                >
            </div>

            <div class="form-group">
                <label for="companyId">Company ID (Optional)</label>
                <input
                    type="text"
                    id="companyId"
                    placeholder="Leave empty for auto-detection"
                >
            </div>

            <button type="submit">Login</button>
        </form>

        <div id="response" class="response"></div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const responseDiv = document.getElementById('response');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const companyId = document.getElementById('companyId').value;

            const submitBtn = form.querySelector('button');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Logging in<span class="loading"></span>';

            try {
                const payload = {
                    email,
                    password,
                };

                if (companyId) {
                    payload.companyId = companyId;
                }

                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify(payload),
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    responseDiv.className = 'response success';
                    responseDiv.innerHTML = `
                        <div class="response-title">✅ Login Successful!</div>
                        <div class="response-content">${JSON.stringify(data, null, 2)}</div>
                        <div class="token-info">
                            <h3>Access Token</h3>
                            <div class="token">${data.access_token}</div>
                            <button class="copy-btn" onclick="copyToClipboard('${data.access_token}')">Copy Token</button>
                            <h3 style="margin-top: 15px;">Refresh Token</h3>
                            <div class="token">${data.refresh_token}</div>
                            <button class="copy-btn" onclick="copyToClipboard('${data.refresh_token}')">Copy Token</button>
                        </div>
                    `;

                    // Store tokens
                    localStorage.setItem('accessToken', data.access_token);
                    localStorage.setItem('refreshToken', data.refresh_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                } else {
                    responseDiv.className = 'response error';
                    responseDiv.innerHTML = `
                        <div class="response-title">❌ Login Failed</div>
                        <div class="response-content">${JSON.stringify(data, null, 2)}</div>
                    `;
                }
            } catch (error) {
                responseDiv.className = 'response error';
                responseDiv.innerHTML = `
                    <div class="response-title">❌ Error</div>
                    <div class="response-content">${error.message}</div>
                `;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Login';
            }
        });

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Token copied to clipboard!');
            });
        }

        // Show stored user on page load
        window.addEventListener('load', () => {
            const user = localStorage.getItem('user');
            if (user) {
                console.log('Stored user:', JSON.parse(user));
            }
        });
    </script>
</body>
</html>
